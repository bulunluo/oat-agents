[package]
name = "oat-agents"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Run a supervised team of coding agents on one machine, on git worktrees and tmux"
repository = "https://github.com/Noopher-AI/oat-agents"
readme = "README.md"
keywords = ["agents", "claude", "codex", "tmux", "worktree"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oat-agents"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "7.0.0"
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
k8s-openapi = { version = "0.26", features = ["v1_33"] }
kube = { version = "2.0.1", default-features = false, features = ["client", "rustls-tls", "ws"] }
libc = "0.2"
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "time"] }
toml = "1.1.6"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
